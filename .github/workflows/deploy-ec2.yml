name: Deploy Backend to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-production-deploy
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Run tests
        run: ./gradlew test

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      SSM_DOCUMENT: ${{ vars.SSM_DEPLOY_DOCUMENT }}
      DEPLOY_ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
    steps:
      - name: Check deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in AWS_REGION INSTANCE_ID SSM_DOCUMENT DEPLOY_ROLE; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository variable: $name"
              exit 1
            fi
          done
      - name: Authenticate to AWS with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          role-session-name: oao-deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy tested commit through Systems Manager
        shell: bash
        run: |
          set -euo pipefail
          command_id=$(aws ssm send-command \
            --document-name "$SSM_DOCUMENT" \
            --instance-ids "$INSTANCE_ID" \
            --parameters "Commit=$GITHUB_SHA" \
            --timeout-seconds 600 \
            --comment "lc_back $GITHUB_SHA" \
            --query 'Command.CommandId' --output text)
          echo "SSM command: $command_id"
          for attempt in $(seq 1 190); do
            if aws ssm get-command-invocation --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" > invocation.json 2> invocation-error.txt; then
              status=$(jq -r .Status invocation.json)
              case "$status" in
                Success)
                  jq -r '.StandardOutputContent' invocation.json
                  echo "Deployed $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
                  exit 0
                  ;;
                Failed|Cancelled|TimedOut|Cancelling)
                  jq -r '.Status, .StandardOutputContent, .StandardErrorContent' invocation.json
                  exit 1
                  ;;
              esac
            elif ! grep -q InvocationDoesNotExist invocation-error.txt; then
              cat invocation-error.txt >&2
              exit 1
            fi
            sleep 10
          done
          echo "Deployment exceeded polling timeout; inspect SSM command $command_id." >&2
          exit 1
      - name: Verify public API
        run: curl --fail --silent --show-error --max-time 15 https://api.oao365.com/api/health
