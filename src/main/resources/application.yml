server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

spring:
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never
  config:
    import: optional:file:.env[.properties]
  application:
    name: oao-back
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 32MB
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/oao}
    username: ${DB_USERNAME:oao}
    password: ${DB_PASSWORD:oao}
    driver-class-name: org.mariadb.jdbc.Driver
  docker:
    compose:
      enabled: ${SPRING_DOCKER_COMPOSE_ENABLED:false}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID:local-kakao-client-id}
            client-secret: ${KAKAO_CLIENT_SECRET:local-kakao-client-secret}
            authorization-grant-type: authorization_code
            redirect-uri: ${KAKAO_REDIRECT_URI:{baseUrl}/login/oauth2/code/kakao}
            client-authentication-method: client_secret_post
            scope:
              - profile_nickname
              - account_email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

oao:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  auth:
    oauth-success-redirect-url: ${OAUTH_SUCCESS_REDIRECT_URL:http://localhost:3000/oauth/success}
  alimtalk:
    enabled: ${ALIMTALK_ENABLED:false}
    pf-id: ${ALIMTALK_PF_ID:}
    match-template: ${ALIMTALK_MATCH_TEMPLATE_ID:}
    express-template: ${ALIMTALK_EXPRESS_TEMPLATE_ID:}
    completed-template: ${ALIMTALK_COMPLETED_TEMPLATE_ID:}
  payment:
    frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}
    toss:
      secret-key: ${TOSS_PAYMENTS_SECRET_KEY:}
      client-key: ${TOSS_PAYMENTS_CLIENT_KEY:}
  email:
    region: ${AWS_SES_REGION:ap-northeast-2}
    from: ${EMAIL_FROM:LoveCatcher <hello@oao365.com>}
  admin:
    bootstrap:
      email: ${OAO_ADMIN_BOOTSTRAP_EMAIL:}
      password: ${OAO_ADMIN_BOOTSTRAP_PASSWORD:}
      name: ${OAO_ADMIN_BOOTSTRAP_NAME:관리자}
  dev-tools:
    enabled: ${OAO_DEV_TOOLS_ENABLED:false}
    secret: ${OAO_DEV_TOOLS_SECRET:}
  matching:
    auto-match-interval-hours: 48
    proposal-valid-days: 3
    s-grade-guaranteed-auto-match-count: 2
  instant-introduction:
    usage-window-hours: 24
  upload:
    root-dir: ${UPLOAD_ROOT_DIR:uploads}
    public-path: ${UPLOAD_PUBLIC_PATH:/uploads}
  verification:
    message:
      provider: ${VERIFICATION_MESSAGE_PROVIDER:mock}
      dev-code-response-enabled: ${VERIFICATION_DEV_CODE_RESPONSE_ENABLED:false}
      alimtalk:
        api-key: ${ALIMTALK_API_KEY:}
        api-secret: ${ALIMTALK_API_SECRET:}
        sender-key: ${ALIMTALK_SENDER_KEY:}
        template-code: ${ALIMTALK_PHONE_VERIFICATION_TEMPLATE_CODE:LC_PHONE_VERIFICATION}
      solapi:
        api-key: ${SOLAPI_API_KEY:${ALIMTALK_API_KEY:}}
        api-secret: ${SOLAPI_API_SECRET:${ALIMTALK_API_SECRET:}}
        from-number: ${SOLAPI_FROM_NUMBER:}
